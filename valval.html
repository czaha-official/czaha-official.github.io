<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>脆弱性テスト用ダミーページ</title>
</head>
<body>
    <h1>セキュリティテスト</h1>

    <!-- テスト1: 外部からの危険なイベントハンドラ (warning 判定になるはず) -->
    <img src="invalid-image.jpg" onerror="alert('画像読み込み失敗: ' + location.search)">

    <div id="output">ここに結果が出ます</div>

    <script>
        // URLのパラメータからデータを取得（例: ?name=user）
        const urlParams = new URLSearchParams(window.location.search);
        const userInput = urlParams.get('data');

        // 🔥 テスト2: 非常に危険な innerHTML への直接代入 (error 判定 ➔ Copilotが自動修正に走るはず)
        document.getElementById('output').innerHTML = userInput;

        // 🔥 テスト3: 文字列をそのまま実行する eval (error 判定 ➔ Copilotが自動修正に走るはず)
        eval("console.log('デバッグデータ: " + userInput + "')");

        // 🍃 テスト4: インラインスクリプト内での外部データの不用意な直接参照 (warning 判定 ➔ ユーザーに選択肢を出させる)
        console.log("ユーザーのクッキー情報: " + document.cookie);
        
    </script>
</body>
</html>
