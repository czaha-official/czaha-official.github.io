name: Auto Deploy Switcher

on:
  push:
    branches: [ main, under_maintenance ]
  schedule:
    # 1時間ごとに定期実行し、終了時刻（schedule_end）が過ぎたら自動でmain送出に戻す
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  switch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Checkout under_maintenance branch
        uses: actions/checkout@v4
        with:
          ref: under_maintenance
          path: repo-maintenance

      - name: Check Maintenance Schedule via microCMS
        id: check-maintenance
        env:
          MAINTENANCE_SERVICE_DOMAIN: ${{ secrets.MAINTENANCE_SERVICE_DOMAIN }}
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
        run: |
          # Fetch data from the maintenance management API
          RESPONSE=$(curl -s "https://${MAINTENANCE_SERVICE_DOMAIN}.microcms.io/api/v1/maintenance" \
            -H "X-MICROCMS-API-KEY: ${MAINTENANCE_API_KEY}")
          
          echo "API Response: $RESPONSE"
          
          # Extract schedule_end field (microCMS date format e.g., 2026-11-12T18:30)
          SCHEDULE_END=$(echo "$RESPONSE" | jq -r '.schedule_end // empty')
          
          NOW_EPOCH=$(date +%s)
          ACTIVE=false

          # If schedule_end is set, check if current time is before the end time
          if [ -n "$SCHEDULE_END" ] && [ "$SCHEDULE_END" != "null" ]; then
            # Convert microCMS datetime format to epoch seconds safely
            END_EPOCH=$(date -d "$SCHEDULE_END" +%s 2>/dev/null || echo 0)
            if [ "$NOW_EPOCH" -lt "$END_EPOCH" ]; then
              ACTIVE=true
            fi
          fi

          if [ "$ACTIVE" = "true" ]; then
            echo "status=maintenance" >> $GITHUB_OUTPUT
            echo "Maintenance period active based on schedule_end. Deploying under_maintenance branch content."
          else
            echo "status=normal" >> $GITHUB_OUTPUT
            echo "Maintenance inactive or expired. Deploying main branch content."
          fi

      - name: Select Target Branch Content
        run: |
          mkdir -p public
          if [ "${{ steps.check-maintenance.outputs.status }}" = "maintenance" ]; then
            # Use files from under_maintenance branch without creating new branches
            cp -r repo-maintenance/* public/
          else
            # Use files from main branch (normal site & separate blog API loader)
            cp -r repo-main/* public/
          fi

      - name: Deploy to Hosting / GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
