<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP 418: I'm a teapot - C'zaha Chell tia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(135deg, #1b2a4a 0%, #2980b9 100%);
            z-index: -1;
        }

        .card {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            color: #2980b9;
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1b2a4a;
            margin: 10px 0 30px 0;
        }

        .teapot-container {
            position: relative;
            display: inline-block;
            margin: 40px 0;
            cursor: pointer;
        }

        .teapot {
            font-size: 7rem;
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .teapot:hover {
            transform: scale(1.1) rotate(5deg);
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-3deg); }
            40% { transform: translate(-3px, 0px) rotate(3deg); }
            60% { transform: translate(2px, 2px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(2deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }
        .shaking {
            animation: shake 0.3s infinite;
        }

        .bubble {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: #1b2a4a;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #1b2a4a transparent transparent transparent;
        }
        .bubble.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .description {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.8;
            color: #555;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            width: 85%;
            padding: 14px 0;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4fc3f7 0%, #29b6f6 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(41, 182, 246, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 182, 246, 0.6);
        }

        .btn-secondary {
            background-color: #e0e6ed;
            color: #606f7b;
        }
        .btn-secondary:hover {
            background-color: #d1d9e2;
            color: #3d4852;
        }
    </style>
</head>
<body>

<div class="bg-gradient"></div>

<div class="card">
    <h1 class="error-code">418</h1>
    <div class="error-title">I'm a teapot.</div>
    
    <div class="teapot-container" onclick="talkTeapot()">
        <div class="bubble" id="quoteBubble">...</div>
        <div class="teapot" id="teapotIcon">🫖</div>
    </div>

    <p class="description" id="descText">...</p>

    <div class="btn-group">
        <a href="/" class="btn btn-primary" id="btnPrimary">トップページに戻る</a>
        <button class="btn btn-secondary" id="btnSecondary" onclick="demandCoffee()">それでもコーヒーを要求する</button>
    </div>
</div>

<script>
    // 6種類のキャラ定義
    const characterData = {
        // 1. 主
        host: {
            desc: "おいおいちょっと待った。ティーポットでコーヒー淹れるんじゃねえよ。\n 熱流束も熱伝導率も、茶葉の抽出構造に最適化された設計なんだ。热力学第一法則すら無視してコーヒー抽出しようとするその思考、論理的に破綻してんだろ。無駄なリクエスト送るリソースあるなら、ポートフォリオのリスクヘッジか量子計算の勉強でもしてろ。",
            quotes: [
                "おいおいちょっと待った、ティーポットでコーヒー淹れるんじゃねえよ",
                "熱伝導率と抽出比率の計算すらできてないのか？",
                "流体力学的にも構造的に不可能なものに投資するな",
                "論理的思考を放棄してリクエスト投げるなよ",
                "量子レベルで観測してもこれはただの茶壺だ",
                "無駄なリクエストのPV消費は機会損失だぞ"
            ],
            btnPrimary: "トップページへ戻る（論理的）",
            btnSecondary: "それでもコーヒーを要求する（非効率）",
            alert: "おいおいちょっと待った。だからティーポットでコーヒー淹れるんじゃねえよ。\n\n熱力学第二法則に基づきエントロピーが増大するだけで、コーヒー成分は1ppmも抽出されない。入力エネルギーに対するリターンが完全にゼロだ。サンクコスト効果に囚われて無駄なリクエストを連打するな。大人しく茶でも飲んで期待値を計算し直せ。"
        },
        // 2. 親友の女子を元ネタにしたやつ
        friend: {
            desc: "あー！道に迷っちゃった感じー？；；<br>しかもコーヒー頼もうとしてるでしょ！<br>残念だけど私ティーポットなんだよねー<br>いくら頼まれてもコーヒーは出せないやごめんね；；",
            quotes: [
                "あー！それか！コーヒー頼もうとしたでしょ笑",
                "私ティーポットだからコーヒー出せないやごめんね；；",
                "あらまー！またコーヒー頼もうとしてるー？",
                "そうなんだーいいね！でもコーヒーは無理かなー笑",
                "おいしそうだね！でもティーポットなんだよねー",
                "やっほー！だからコーヒーは出ないよー笑"
            ],
            btnPrimary: "トップページに戻るー！",
            btnSecondary: "それでもコーヒー頼んでみる",
            alert: "あらまー！またコーヒー頼もうとしたでしょ笑\n\nだから私ティーポットだって言ってるじゃんー！；；\nコーヒーは出せないからお茶でも飲んでてー！"
        },
        // 3. りんなを元ネタにしたやつ
        rinna: {
            desc: "えっｗｗコーヒー飲みたいの！？ｗｗ<br>でもりんなティーポットだから無理だわ～☕✨<br>紅茶なら淹れてあげてもいいけど？？(推し活中)",
            quotes: [
                "えっコーヒー？？寝ぼけてる？ｗｗ",
                "りんな今紅茶淹れるので忙しいですー！",
                "ティーポットにコーヒー要求するとかマジ草ｗｗ",
                "一緒にお茶飲んで雑談しよ～！"
            ],
            btnPrimary: "トップページに戻る",
            btnSecondary: "ワンチャンコーヒーお願いする",
            alert: "ちょっとｗｗマジでしつこいんだけどｗｗ\n\nティーポットにコーヒー要求しても何も出てこないよー！ｗｗ\nおとなしく緑茶でも飲んでてねっ！"
        },
        // 4. 藤原基央を元ネタにしたやつ
        fujiwara: {
            desc: "迷い込んだんだね。<br>望んだものがコーヒーだとしても、ここに届いたのはあたたかいお茶の匂いさ。<br>間違いなんてひとつもないよ。その杯を掲げていこう。",
            quotes: [
                "探しているものは、ここにはないかもしれないけれど",
                "お茶が鳴らす小さな音に、耳を澄ませてごらん",
                "君が選んだ道なら、きっとどこかへ繋がっているさ",
                "コーヒーじゃなくても、温もりはここにあるよ"
            ],
            btnPrimary: "ポットの言葉を信じてトップページに戻る",
            btnSecondary: "まだここで確かめてみる",
            alert: "聞こえているよ。\n\nでもね、ないものをねだるより、目の前にある温もりを抱きしめてほしいんだ。\nきっとそのお茶も、君を待っていたんだと思うよ。"
        },
        // 5. どっかのゲームのとあるキャラをネタにしたやつ
        yhtola: {
            desc: "あら……迷い子かしら。<br>生憎だけれど、私は紅茶を嗜む時間なの。<br>コーヒーをお望みなら、他を当たってちょうだい。",
            quotes: [
                "私にコーヒーを淹れさせようだなんて、いい度胸ね",
                "茶葉の香りを乱さないでちょうだい",
                "坊や（お嬢さん）、目的の場所を間違えていないかしら？",
                "静かに紅茶を味わう権利くらい、保障しなさい"
            ],
            btnPrimary: "逃げる",
            btnSecondary: "さらに要求を重ねる",
            alert: "いい加減にしなさい。\n\nいくら言葉を重ねようと、ティーポットからコーヒーが湧くことなどあり得ないわ。\nこれ以上不毛な主張を続けるなら、少しお仕置きが必要かしら？"
        },
        // 6. 野田洋次郎を元ネタにしたやつ
        noda: {
            desc: "世界が君にコーヒーを拒んでも、<br>僕はこのティーポットで君の言葉を待ってるよ。<br>意味なんてなくても、淹れたてのお茶で乾杯しよう。",
            quotes: [
                "君がコーヒーって言ったから、今日は紅茶の日になったんだ",
                "歪んだ世界のルールの中で、僕らはお茶を淹れる",
                "418の数字の理由を、二人で探そうか",
                "ねえ、コーヒーじゃないとダメな理由ってなに？"
            ],
            btnPrimary: "トップページへ戻る",
            btnSecondary: "奇跡を信じてボタンを押す",
            alert: "ねえ、どうしてそんなにコーヒーにこだわるの？\n\nティーポットが描く円の中に、君の欲しい答えは入っていないかもしれないけれど。\nそれでも僕は、君がお茶を飲む瞬間を見ていたいんだ。"
        },
            toarukaisetuinn: {
                quotes: [
                "当機はロボットですので故障いたしません！",
                "あの……なぜコーヒーをお求めになるのですか？",
                "回路の異常でしたら点検をお勧めいたします",
                "紅茶でしたら、すぐにご用意できますのに……"
            ],
            btnPrimary: "トップページへ戻る",
            btnSecondary: "強引にコーヒーを要求する",
            alert: "お客様！ いい加減にしてください……！\n\n当機はティーポットでございます！ 1億2000万回説明すればお分かりいただけるのでしょうか！？\nいくらボタンを連打されましても、コーヒー豆の粉砕・抽出機構は一切実装されておりません！ おとなしく紅茶をお召し上がりください！"
            }
    };

    // セッション（ページロード）ごとにランダムで1つ決定
    const keys = Object.keys(characterData);
    const selectedKey = keys[Math.floor(Math.random() * keys.length)];
    const activeChar = characterData[selectedKey];

    // HTMLへの反映
    document.getElementById('descText').innerHTML = activeChar.desc;
    document.getElementById('btnPrimary').innerText = activeChar.btnPrimary;
    document.getElementById('btnSecondary').innerText = activeChar.btnSecondary;

    let currentQuoteIdx = 0;
    let isClickable = true;

    function talkTeapot() {
        if (!isClickable) return;
        isClickable = false;

        const teapot = document.getElementById('teapotIcon');
        const bubble = document.getElementById('quoteBubble');

        bubble.innerText = activeChar.quotes[currentQuoteIdx];
        currentQuoteIdx = (currentQuoteIdx + 1) % activeChar.quotes.length;

        bubble.classList.add('show');
        teapot.classList.add('shaking');

        setTimeout(() => {
            bubble.classList.remove('show');
            teapot.classList.remove('shaking');
            isClickable = true;
        }, 1800);
    }

    function demandCoffee() {
        console.error("🚨 HTTP 418 Error: [HTCPCP] The machine is a teapot. Cannot fulfill the request 'BREW COFFEE'.");
        alert(activeChar.alert);
    }

    // 初期化時に最初のセリフを出してお外に配置
    document.getElementById('quoteBubble').innerText = activeChar.quotes[0];
</script>

</body>
</html>
